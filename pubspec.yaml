name: pdm_rutine
description: Aplicación de gestión de mantenimientos técnicos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # ── Localización (requerido para DatePicker en español) ─────────
  flutter_localizations:
    sdk: flutter

  # ── Estado ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Base de datos local (SQLite, offline-first) ─────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ── Calendario visual ───────────────────────────────────────────
  table_calendar: ^3.1.2

  # ── Generación y visualización de PDF ──────────────────────────
  pdf: ^3.11.1
  path_provider: ^2.1.3
  printing: ^5.13.1

  # ── Envío de correo con adjunto ─────────────────────────────────
  flutter_email_sender: ^6.0.3

  # ── Notificaciones locales programadas ──────────────────────────
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # ── Navegación declarativa ──────────────────────────────────────
  go_router: ^14.3.0

  # ── Utilidades ──────────────────────────────────────────────────
  uuid: ^4.4.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
